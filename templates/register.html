{% extends "baseGreet.html" %}

{% block nav %}
<nav>
    <ul>
        <li><a href="{{url_for('login')}}"> login </a> </li>
    </ul>
</nav>
{% endblock %}

{% block main_content %}
<h1>Register</h1>

<form id="registerform" action="{{url_for('register')}}" method="post">
    <label>Email: <input type="text" name="email" required="" pattern="^\w+@\w+\.edu$"></label>
    <label>Username: <input type="text" name="username" required=""></label>
    <label>Password: <input type="password" name="password1" required=""></label>
    <label>Confirm Password: <input type="password" name="password2" required=""></label>
    <button type="submit">register</button>
</form>


{% endblock %}
