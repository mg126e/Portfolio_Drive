{% extends "baseGreet.html" %}
{% block main_content %}

<h1>Create a New Item</h1>    

<!-- I am using code from the file-upload class reading to help with this -->
<form id="upload-form" method="post" action="{{ url_for('file_upload') }}"
      enctype="multipart/form-data">

    <!-- For now, I am using the "structural" method for adding labels-->

    <p><label>Course Number: 
        <input required type = "text" name="course_number" placeholder="e.g. CS304">
    </label></p>

    <p><label>Semester: 
        <select required name="semester">
        <option value = "">choose semester</option>
        <!-- should the instructions in the line above be "choose semester" or "choose term" or something else? Diff institutions will be different-->
        <option>Fall</option>
        <option>Spring</option>
        <option>Summer</option>
        <option>Winter</option>
        </select>
    </label></p>

    <p><label>Year: 
        <input required type="number" name="year" min="2000">
    </label></p>

    <p><label>Upload a file:
        <input type="file" name="file">
    </label></p>

    <p><label>Or paste text: <br>
        <textarea name="text_content" rows="10" cols="50"></textarea>
    </label></p>

    <p><label>Name:
        <input required type = "text" name="name" placeholder="e.g. Lab 9 (Rate of Photosynthesis)">
    </label></p>

    <p><label>Tags (separate with commas):
        <input type = "text" name="tags" placeholder="e.g. SQL, lab procedure, Python">
    </label></p>

    <p><input type = "submit" value = "Create"></p>
    <!-- This is the submit button-->
</form>

<!-- <form action = "https://cs.wellesley.edu/~cs304flask/cgi-bin/dump.cgi" method = "post"> -->

  <a href="http://validator.w3.org/check?uri=referer">
     <img 
       src="http://cs.wellesley.edu/~cs110/Icons/valid-html5v2.png"
       alt="Valid HTML 5"
       title="Valid HTML 5"  
       height="31" width="88">
  </a> 
</p>
{% endblock %}
