{% extends "baseGreet.html" %}

{% block main_content %}

<h1>Home</h1>

<p>Welcome {{ info.username }}</p>
<p>Email: {{ info.email }}</p>
<p>Institution: {{ info.institution }}</p>

{% if info.major2 is not none %}
    <p>Majors: {{ info.major1 }}, {{ info.major2 }}</p>
    <button type="button" onclick="editProfile()" style="border-radius: 20px;">
        <img src="{{ url_for('static', filename='image/pencil.svg') }}" alt="pencil to edit" width="20" height="20">
    </button>
{% else %}
    <p>Major: {{ info.major1 }}</p> 
    <button type="button" onclick="editProfile()" style="border-radius: 20px;">
        <img src="{{ url_for('static', filename='image/pencil.svg') }}" alt="pencil to edit" width="20" height="20">
    </button>
{% endif %}

{% endblock %}
