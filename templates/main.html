{% extends "baseGreet.html" %}

{% block main_content %}

<h1>Main</h1>

<p>Welcome to our app. This is the main page</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div id="messages">
  {% for msg in messages %}
  <p>{{msg}}</p>
  {% endfor %}
</div>
{% endif %}
{% endwith %}

{% endblock %}
